[versions]
spring-boot = "4.1.1"
dependency-management = "1.1.7"
protobuf = "0.9.6"

[libraries]
spring-grpc-server = { module = "org.springframework.boot:spring-boot-starter-grpc-server" }
spring-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
postgresql = { module = "org.postgresql:postgresql" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
dependency-management = { id = "io.spring.dependency-management", version.ref = "dependency-management" }
protobuf = { id = "com.google.protobuf", version.ref = "protobuf" }