
services:
  postgres:
    env_file:
      - path: ".env"
        required: true
    image: postgres:17
    container_name: trucks-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trucks -d trucksdb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
